name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: '-D warnings'
  OPENHTTPA_SKIP_ZK_BUILD: '1'
  RISC0_SKIP_BUILD_KERNELS: '1'

jobs:
  lint:
    name: Lint & Format
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Run format and clippy
        run: make ci
      - name: Verify PGP Key Generation
        run: make verify-pgp

  test-core:
    name: Test Core Workspace
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Proactive Disk Hygiene
        run: rm -rf /tmp/openhttpa-build-* || true
      - name: Run core tests
        run: make verify-core

  test-bindings:
    name: Test Bindings & Examples
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Check bindings and examples
        run: make check-bindings verify-examples

  formal-verify:
    name: Formal Security Proofs
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Run ProVerif/Tamarin Proofs
        run: make formal-verify
